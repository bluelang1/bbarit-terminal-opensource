name: Source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source publication guards
        run: |
          python3 -B -m unittest discover -s tests -p 'export_opensource_test.py' -v
          python3 -B scripts/export-opensource.py --audit
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check frontend and public build configuration
        run: |
          npm run lint
          npm run ui:mojibake
          npm run test:run
          npm run test:source-build
          npm run check:bundled-scripts
          npm run office:cli-smoke
          npm run build
      - name: Check local Rust workspace metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action lists the commits of a pull request through the API
      # before scanning them; the default GITHUB_TOKEN needs read access for that.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Scan the full history that reaches this ref, not just the tip commit.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action picks up the repo-root .gitleaks.toml automatically.
          # PR comments would need pull-requests: write; keep the token read-only.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  rust:
    name: Rust (agent tests, host check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bbarit-agent
      - name: Test the embedded agent
        run: cargo test --manifest-path bbarit-agent/Cargo.toml --locked
      - name: Test the vendored mcp-bridge plugin guard
        run: cargo test -p tauri-plugin-mcp-bridge --lib --manifest-path src-tauri/Cargo.toml --locked
      - name: Check the Tauri host crate
        # Plain `cargo check` runs without the `custom-protocol` feature, so the
        # Tauri codegen stays in dev mode and does not require ../dist to exist.
        # whisper-rs/hound are macOS-only (cfg target_os) and are skipped here.
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
