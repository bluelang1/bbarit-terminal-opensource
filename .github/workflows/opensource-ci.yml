name: Source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source publication guards
        run: |
          python3 -B -m unittest discover -s tests -p 'export_opensource_test.py' -v
          python3 -B scripts/export-opensource.py --audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check frontend and public build configuration
        run: |
          npm run test:run
          npm run test:source-build
          npm run check:bundled-scripts
          npm run build
      - name: Check local Rust workspace metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 > /dev/null
