name: Fork release

# Builds the fork's own signed updater artifacts for a version tag and attaches
# them to a DRAFT GitHub release. Publishing the draft is a manual step; only a
# published (non-draft, non-prerelease) release is served from
# releases/latest/download/latest.json, which is the updater endpoint in
# src-tauri/tauri.fork.conf.json.
#
# Required repository secrets (never commit these):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the minisign private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (omit the secret if the key has none)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Require the fork updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before tagging a release."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bbarit-agent
      - run: npm ci
      - name: Build the fork bundle (ad-hoc app signature, signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Arguments after the second `--` go to cargo; --locked keeps CI on the
        # committed Cargo.lock like the source checks workflow.
        run: npm run tauri:build:fork -- -- --locked
      - name: Prepare release assets and latest.json
        run: node scripts/fork-release-manifest.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --out release-out
      - name: Upload to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never replace the assets of a release that was already published:
            # that is what installed apps download. Delete or re-draft it by hand first.
            if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to overwrite its assets."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-out/* \
              --draft --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
          echo "Draft release $GITHUB_REF_NAME is ready; publish it to make it the updater's latest."
