name: Fork release

# Builds the fork's own signed updater artifacts for a version tag and attaches
# them to a DRAFT GitHub release. Publishing the draft is a manual step; only a
# published (non-draft, non-prerelease) release is served from
# releases/latest/download/latest.json, which is the updater endpoint in
# src-tauri/tauri.fork.conf.json.
#
# Required repository secrets (never commit these):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the minisign private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (omit the secret if the key has none)
#
# Optional repository secrets for a stable macOS app signature (make them with
# scripts/fork-codesign-cert.sh; without them the app is signed ad-hoc and the
# run warns). A fixed self-signed certificate keeps the designated requirement
# `identifier "com.bbarit.terminal.source" and certificate root = H"<sha1>"`
# across versions, so macOS folder permissions survive updates. It is not an
# Apple Developer ID and nothing is notarized.
#   FORK_CODESIGN_P12_BASE64    base64 of the .p12 (certificate + private key)
#   FORK_CODESIGN_P12_PASSWORD  password of the .p12

# Trigger: `gh workflow run fork-release.yml --ref main -f tag=vX.Y.Z` after the
# version bump is merged. Running on main keeps the Rust cache on
# refs/heads/main, which every later run can restore; a run on a tag ref saves
# its cache under refs/tags/vX.Y.Z where no other run can see it (each tag
# build was a ~35 minute cold build for that reason; the first run on main is
# still cold). There is deliberately no `push: tags` trigger: a draft release
# carries only a target commit, GitHub creates the git tag when the draft is
# published, and that tag push would start a second, cold, failing run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, must equal v<app version> (e.g. v1.1.54)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Require main
        # Releases are cut from main only (that is also where the cache lives);
        # fail loudly instead of silently skipping when dispatched elsewhere.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow with --ref main (got $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@v5
      - name: Check the release tag before the long build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1) The tag must be v<app version> of this commit (same rule as the
          #    manifest step, but checked in seconds instead of after the build).
          version="$(node -p "const f=require('fs'); const r=p=>JSON.parse(f.readFileSync(p,'utf8')); (r('src-tauri/tauri.macos.conf.json').version || r('src-tauri/tauri.conf.json').version)")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag '$RELEASE_TAG' does not match the app version $version on this commit. Merge the version bump first or fix the tag input."
            exit 1
          fi
          # 2) A git tag that already exists must point at the commit being built
          #    (annotated tags: compare the peeled ^{} commit, not the tag object).
          peeled="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | awk '$2 ~ /\^\{\}$/ {p=$1} $2 !~ /\^\{\}$/ {c=$1} END {print (p ? p : c)}')"
          if [ -n "$peeled" ] && [ "$peeled" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG already points at $peeled, not at $GITHUB_SHA. Bump the version or delete the tag."
            exit 1
          fi
          # 3) A published release is final; a draft from an earlier run may only
          #    be rebuilt from the same commit, or its tag would land elsewhere.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            if [ "$(node -p "require('./release.json').isDraft")" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; bump the version instead."
              exit 1
            fi
            target="$(node -p "require('./release.json').targetCommitish")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::Draft $RELEASE_TAG targets $target, not $GITHUB_SHA. Delete the draft and run again."
              exit 1
            fi
          fi
          rm -f release.json
          echo "Building $RELEASE_TAG from $GITHUB_SHA on $GITHUB_REF_NAME"
      - name: Require the fork updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before running a release."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bbarit-agent
          # A failed signing step must not throw away the 30-minute Rust build.
          cache-on-failure: true
      - run: npm ci
      - name: Check the signing key and password before the long build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo probe > "$RUNNER_TEMP/sign-probe.txt"
          # Fails in seconds with "Wrong password for that key" if the
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret does not match the key.
          npx tauri signer sign "$RUNNER_TEMP/sign-probe.txt" > /dev/null
          rm -f "$RUNNER_TEMP/sign-probe.txt" "$RUNNER_TEMP/sign-probe.txt.sig"
      - name: Import the fork code-signing certificate
        # A temporary keychain on the runner; the cleanup step at the end
        # removes it. The identity is passed to the build as the certificate's
        # SHA-1 (FORK_CODESIGN_IDENTITY, read by scripts/tauri-opensource.mjs),
        # which Tauri hands to `codesign -s`. An untrusted self-signed identity
        # is not listed by `find-identity -v` but codesign accepts it.
        env:
          FORK_CODESIGN_P12_BASE64: ${{ secrets.FORK_CODESIGN_P12_BASE64 }}
          FORK_CODESIGN_P12_PASSWORD: ${{ secrets.FORK_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -z "$FORK_CODESIGN_P12_BASE64" ] && [ -z "$FORK_CODESIGN_P12_PASSWORD" ]; then
            echo "::warning::FORK_CODESIGN_P12_BASE64/FORK_CODESIGN_P12_PASSWORD are not set: the app is signed ad-hoc, so macOS drops folder permissions (Documents, Desktop, Downloads) on every update. See scripts/fork-codesign-cert.sh."
            exit 0
          fi
          if [ -z "$FORK_CODESIGN_P12_BASE64" ] || [ -z "$FORK_CODESIGN_P12_PASSWORD" ]; then
            echo "::error::Set both FORK_CODESIGN_P12_BASE64 and FORK_CODESIGN_P12_PASSWORD, or neither."
            exit 1
          fi
          keychain="$RUNNER_TEMP/fork-codesign.keychain-db"
          p12="$RUNNER_TEMP/fork-codesign.p12"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$FORK_CODESIGN_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$FORK_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Tauri runs `codesign -s <identity>` without --keychain, so the
          # keychain must be on the user search list (keep the existing ones).
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line%\"}"; line="${line#\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identities="$(security find-identity -p codesigning "$keychain" | awk '/^ *[0-9]+\) [0-9A-F]{40} / {print $2}' | sort -u)"
          if [ "$(printf '%s\n' "$identities" | grep -c .)" != 1 ]; then
            echo "::error::Expected exactly one code-signing identity in FORK_CODESIGN_P12_BASE64, found: ${identities:-none}"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "FORK_CODESIGN_IDENTITY=$identities" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$keychain"
          echo "Signing the app with $identities"
      - name: Build the fork bundle (app signed with the fork certificate or ad-hoc, signed updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `vite build` needs more than Node's default ~2 GB heap on the 7 GB
          # macOS arm64 runner (App.tsx alone is >500 KB); it ran out of memory
          # in run 39378093986. The Rust build starts only after it finishes.
          NODE_OPTIONS: --max-old-space-size=5120
        # Arguments after the second `--` go to cargo; --locked keeps CI on the
        # committed Cargo.lock like the source checks workflow.
        run: npm run tauri:build:fork -- -- --locked
      - name: Verify the app signature
        # The updater archive is made from the signed .app inside the build,
        # so it is checked too. With the fork certificate configured, an
        # ad-hoc result or a designated requirement without that certificate
        # fails the release.
        run: |
          bundle=src-tauri/target/release/bundle
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          archive="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          if [ -z "$app" ] || [ -z "$archive" ]; then
            echo "::error::No .app or .app.tar.gz under $bundle/macos."
            exit 1
          fi
          unpacked="$RUNNER_TEMP/updater-archive"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          archived_app="$(find "$unpacked" -maxdepth 1 -name '*.app' -print -quit)"
          for target in "$app" "$archived_app"; do
            echo "== $target"
            codesign --verify --deep --strict --verbose=2 "$target"
            codesign -dv "$target" 2>&1
            codesign -d -r- "$target" 2>&1
          done
          requirement="$(codesign -d -r- "$app" 2>&1 | sed -n 's/^.*designated => //p')"
          if [ "$(codesign -d -r- "$archived_app" 2>&1 | sed -n 's/^.*designated => //p')" != "$requirement" ]; then
            echo "::error::The updater archive's app has a different designated requirement than the built app."
            exit 1
          fi
          if [ -z "${FORK_CODESIGN_IDENTITY:-}" ]; then
            echo "::warning::App signed ad-hoc (designated requirement: $requirement); folder permissions reset on every update."
            exit 0
          fi
          fingerprint="$(printf '%s' "$FORK_CODESIGN_IDENTITY" | tr 'A-F' 'a-f')"
          case "$requirement" in
            *'identifier "com.bbarit.terminal.source"'*"H\"$fingerprint\""*) ;;
            *)
              echo "::error::Designated requirement does not name the fork certificate $FORK_CODESIGN_IDENTITY: $requirement"
              exit 1
              ;;
          esac
          # Every Mach-O in the bundle (main binary, sidecars, helpers) must be
          # signed with the certificate, not ad-hoc.
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              info="$(codesign -dv "$file" 2>&1 || true)"
              if printf '%s\n' "$info" | grep -q 'Signature=adhoc' || ! printf '%s\n' "$info" | grep -q '^Signature size='; then
                echo "::error::$file is not signed with the fork certificate:"
                printf '%s\n' "$info"
                exit 1
              fi
              echo "signed: ${file#"$app"/}"
            fi
          done < <(find "$app" -type f -print0)
      - name: Prepare release assets and latest.json
        # Besides the versioned dmg, release-out/ gets a version-free copy
        # (BBARIT-Terminal-Source_aarch64.dmg) that the README links through
        # releases/latest/download/; the updater files keep their names.
        run: node scripts/fork-release-manifest.mjs --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --out release-out
      - name: Upload to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never replace the assets of a release that was already published:
            # that is what installed apps download. Delete or re-draft it by hand first.
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; refusing to overwrite its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # --target records the commit; GitHub creates the git tag there when
            # the draft is published.
            # Body: this version's CHANGELOG.md section, then the install
            # guide; GitHub appends the generated PR list (--generate-notes).
            # A missing section only warns, so the release still goes out.
            notes="$RUNNER_TEMP/release-notes.md"
            if node scripts/changelog-section.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/changelog-section.md"; then
              { cat "$RUNNER_TEMP/changelog-section.md"; printf '\n'; cat .github/release/notes-header.md; } > "$notes"
            else
              echo "::warning::CHANGELOG.md has no section for $RELEASE_TAG; the release body has only the install guide and the generated PR list."
              cp .github/release/notes-header.md "$notes"
            fi
            gh release create "$RELEASE_TAG" release-out/* \
              --draft --title "$RELEASE_TAG" --notes-file "$notes" --generate-notes \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
          echo "Draft release $RELEASE_TAG is ready; publish it to make it the updater's latest."
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fork-codesign.p12"
          keychain="$RUNNER_TEMP/fork-codesign.keychain-db"
          if [ -e "$keychain" ]; then
            # delete-keychain also takes it off the user search list.
            security delete-keychain "$keychain"
          fi
          security list-keychains -d user
