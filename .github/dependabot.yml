version: 2
# Note: `xlsx` is a URL dependency (cdn.sheetjs.com tarball) because the npm
# registry build is unpatched. Dependabot and `npm audit` both skip URL deps,
# so SheetJS advisories must be tracked by hand (https://cdn.sheetjs.com).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tauri JS packages must move together with the Rust crates.
      - dependency-name: "@tauri-apps/*"
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /bbarit-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
