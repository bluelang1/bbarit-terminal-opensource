[package]
name = "octo-ui"
default-run = "octo-ui"
version = "1.1.52"
description = "Octo IDE - AI Coding Assistant"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []

[dependencies]
# "unstable": Window::add_child(child webview) for the internal browser.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
libc = "0.2"
portable-pty = "0.8"
screenshots = "0.8.10"
base64 = "0.22"
rand = "0.8"
sysinfo = "0.33"
socket2 = { version = "0.5", features = ["all"] }
arboard = "3.4"
png = "0.17"
regex = "1.11"
surrealdb = { version = "2", default-features = false, features = ["kv-rocksdb"] }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
sha2 = "0.10"
# Chrome/Chromium 프로필 임포트: macOS는 AES-128-CBC(Keychain 키), Windows는 AES-256-GCM(DPAPI 키).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
urlencoding = "2"
notify = { version = "7", features = ["macos_fsevent"] }
font-kit = "0.14"
dirs = "5"
# Vendored copy with an Origin/Host guard on its control WebSocket; see
# vendor/tauri-plugin-mcp-bridge/README.md.
tauri-plugin-mcp-bridge = { path = "vendor/tauri-plugin-mcp-bridge" }
tauri-plugin-single-instance = "2"

# Internalized BBARIT coding agent: compiled INTO this app binary (no separate
# exe). The app re-execs itself with BBARIT_AGENT_MODE=1 to run the agent TUI.
bbarit = { path = "../bbarit-agent" }

# --- Embedded Semble dependencies ---
# (tokenizers/safetensors/hf-hub/half are pulled in by model2vec-rs; listing
# them here too built a second, unused tokenizers 0.20 with its own C++ deps.)
once_cell = "1"
chrono = { version = "0.4", features = ["clock"] }
ignore = "0.4"
ndarray = "0.15"
anyhow = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-swift = "0.7"
model2vec-rs = "0.2.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-drag = "2"

# Local Whisper (offline STT) is macOS-only. On Windows it pulls in whisper.cpp
# (CMake /MD) which conflicts with esaxx-rs (/MT static CRT) at link time
# (LNK2038 RuntimeLibrary mismatch). Most users don't use voice, so we exclude it.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = "0.14"
hound = "3.5"

# Windows: mark the bridge listen socket non-inheritable so spawned PTY/WebView2
# children don't inherit it and keep it alive (zombie LISTENING) after the app
# dies, which blocks the next launch from binding the port. Version pinned to
# the one already in the tree via tauri (transitive), so no extra download.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
