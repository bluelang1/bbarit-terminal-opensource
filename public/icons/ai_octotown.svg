<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- octopus head -->
  <ellipse cx="12" cy="9" rx="6.5" ry="5.8" stroke-width="1.8"/>
  <!-- left eye -->
  <circle cx="9.4" cy="8.6" r="1" fill="currentColor" stroke="none"/>
  <!-- right eye -->
  <circle cx="14.6" cy="8.6" r="1" fill="currentColor" stroke="none"/>
  <!-- smile -->
  <path d="M10 11a2.4 2.4 0 0 0 4 0" stroke-width="1.3"/>
  <!-- baton in right tentacle -->
  <path d="M17 13c1.5-2 3-5 3.5-6.5" stroke-width="1.6"/>
  <circle cx="20.8" cy="5.8" r="1.1" fill="currentColor" stroke="none" opacity="0.8"/>
  <!-- tentacles -->
  <path d="M6.5 13.5c-1 2-1.8 4.5-.5 5.5" stroke-width="1.6"/>
  <path d="M9 14.2c-.3 2-.2 4.5 1 5" stroke-width="1.6"/>
  <path d="M15 14.2c.3 2 .2 4.5-1 5" stroke-width="1.6"/>
  <!-- music note sparkle -->
  <path d="M2.5 5v3.5" stroke-width="1.2" opacity="0.5"/>
  <circle cx="1.5" cy="8.5" r="1" stroke-width="1" opacity="0.5"/>
</svg>
